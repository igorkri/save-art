services:
    db:
        image: mysql:8.0
        container_name: save-art-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: save-art
            MYSQL_USER: igor
            MYSQL_PASSWORD: password
        ports:
            - "13306:3306"
        volumes:
            - ./mysql-data:/var/lib/mysql
        command: >
            --default-authentication-plugin=mysql_native_password
            --sort_buffer_size=64M
            --read_buffer_size=8M
            --read_rnd_buffer_size=8M
            --join_buffer_size=8M
            --tmp_table_size=128M
            --max_heap_table_size=128M
            --innodb_buffer_pool_size=512M
        networks:
            - save-art

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: save-art-phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            PMA_USER: root
            PMA_PASSWORD: root
        ports:
            - "8889:80"
        networks:
            - save-art

networks:
    save-art:
        driver: bridge
